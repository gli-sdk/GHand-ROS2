controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - thumb_mcp
      - thumb_tmc_fe
      - thumb_tmc_aa
      - thumb_tmc_ps
      - index_pip
      - index_mcp
      - index_mcp_aa
      - middle_pip
      - middle_mcp
      - ring_pip
      - ring_mcp
      - little_pip
      - little_mcp

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    allow_partial_joints_goal: true
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.01
      thumb_mcp:        { goal: 0.1, trajectory: 0.5 }
      thumb_tmc_fe:     { goal: 0.1, trajectory: 0.5 }
      thumb_tmc_aa:     { goal: 0.1, trajectory: 0.5 }
      thumb_tmc_ps:     { goal: 0.1, trajectory: 0.5 }
      index_pip:        { goal: 0.1, trajectory: 0.5 }
      index_mcp:        { goal: 0.1, trajectory: 0.5 }
      index_mcp_aa:     { goal: 0.1, trajectory: 0.5 }
      middle_pip:       { goal: 0.1, trajectory: 0.5 }
      middle_mcp:       { goal: 0.1, trajectory: 0.5 }
      ring_pip:         { goal: 0.1, trajectory: 0.5 }
      ring_mcp:         { goal: 0.1, trajectory: 0.5 }
      little_pip:       { goal: 0.1, trajectory: 0.5 }
      little_mcp:       { goal: 0.1, trajectory: 0.5 }
