controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
joint_trajectory_controller:
  ros__parameters:
    joints:
    - THUMB_TMC_FE
    - THUMB_TMC_AA
    - FF_MCP
    - MF_MCP
    - RF_MCP
    - LF_MCP
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    allow_partial_joints_goal: true
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.01
      THUMB_TMC_FE:
        goal: 0.1
        trajectory: 0.5
      THUMB_TMC_AA:
        goal: 0.1
        trajectory: 0.5
      FF_MCP:
        goal: 0.1
        trajectory: 0.5
      MF_MCP:
        goal: 0.1
        trajectory: 0.5
      RF_MCP:
        goal: 0.1
        trajectory: 0.5
      LF_MCP:
        goal: 0.1
        trajectory: 0.5
