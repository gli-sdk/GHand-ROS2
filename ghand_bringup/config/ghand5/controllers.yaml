controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_status_broadcaster:
      type: ghand_controllers/JointStatusBroadcaster
    tactile_broadcaster:
      type: ghand_controllers/TactileBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    position_controller:
      type: position_controllers/JointGroupPositionController
    velocity_percent_controller:
      type: forward_command_controller/ForwardCommandController
    current_percent_controller:
      type: forward_command_controller/ForwardCommandController
joint_status_broadcaster:
  ros__parameters:
    joints:
    - Thumb_IP
    - Thumb_MCP
    - Thumb_TMC_FE
    - Thumb_TMC_AA
    - Thumb_TMC_PS
    - FF_DIP
    - FF_PIP
    - FF_MCP
    - FF_MCP_AA
    - MF_DIP
    - MF_PIP
    - MF_MCP
    - RF_DIP
    - RF_PIP
    - RF_MCP
    - LF_DIP
    - LF_PIP
    - LF_MCP
    publish_rate: 100.0
tactile_broadcaster:
  ros__parameters:
    fingers:
    - thumb
    - index
    - middle
    - ring
    - little
    point_counts:
    - 38
    - 31
    - 31
    - 31
    - 31
    publish_rate: 100.0
joint_trajectory_controller:
