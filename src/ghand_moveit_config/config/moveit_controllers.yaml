# MoveIt controller configuration — connects to the existing joint_trajectory_controller
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

# Allow plenty of time for real hardware fingers to complete a trajectory.
# GHand motor response is non-deterministic, so duration monitoring is disabled.
trajectory_execution:
  allowed_execution_duration_scaling: 3.0
  allowed_goal_duration_margin: 2.0
  allowed_start_tolerance: 0.05
  execution_duration_monitoring: false

moveit_simple_controller_manager:
  controller_names:
    - joint_trajectory_controller

  joint_trajectory_controller:
    type: FollowJointTrajectory
    joints:
      - thumb_mcp
      - thumb_tmc_fe
      - thumb_tmc_aa
      - thumb_tmc_ps
      - index_pip
      - index_mcp
      - index_mcp_aa
      - middle_pip
      - middle_mcp
      - ring_pip
      - ring_mcp
      - little_pip
      - little_mcp
    action_ns: follow_joint_trajectory
    default: true
    allowed_start_tolerance: 0.3
    goal_time_tolerance: 3.0
