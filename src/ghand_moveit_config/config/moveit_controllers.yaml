# MoveIt controller configuration — connects to the existing joint_trajectory_controller
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - joint_trajectory_controller

  joint_trajectory_controller:
    type: FollowJointTrajectory
    joints:
      - thumb_mcp
      - thumb_tmc_fe
      - thumb_tmc_aa
      - thumb_tmc_ps
      - index_pip
      - index_mcp
      - index_mcp_aa
      - middle_pip
      - middle_mcp
      - ring_pip
      - ring_mcp
      - little_pip
      - little_mcp
    action_ns: follow_joint_trajectory
    default: true
    allowed_start_tolerance: 0.05
