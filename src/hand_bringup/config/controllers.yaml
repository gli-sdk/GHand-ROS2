controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_status_broadcaster:
      type: hand_controllers/JointStatusBroadcaster

    tactile_broadcaster:
      type: hand_controllers/TactileBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_status_broadcaster:
  ros__parameters:
    joints:
      - thumb_tmc_ps
      - thumb_tmc_aa
      - thumb_tmc_fe
      - thumb_mcp
      - thumb_dip
      - index_mcp_aa
      - index_mcp
      - index_pip
      - index_dip
      - middle_mcp
      - middle_pip
      - middle_dip
      - ring_mcp
      - ring_pip
      - ring_dip
      - little_mcp
      - little_pip
      - little_dip
    publish_rate: 100.0

tactile_broadcaster:
  ros__parameters:
    fingers:
      - thumb
      - index
      - middle
      - ring
      - little
    point_counts:
      - 38
      - 31
      - 31
      - 31
      - 31
    publish_rate: 100.0

joint_trajectory_controller:
  ros__parameters:
    joints:
      - thumb_tmc_ps
      - thumb_tmc_aa
      - thumb_tmc_fe
      - thumb_mcp
      - thumb_dip
      - index_mcp_aa
      - index_mcp
      - index_pip
      - index_dip
      - middle_mcp
      - middle_pip
      - middle_dip
      - ring_mcp
      - ring_pip
      - ring_dip
      - little_mcp
      - little_pip
      - little_dip
    command_interfaces:
      - position
      - velocity
      - effort
    state_interfaces:
      - position
      - velocity
      - effort
    # true: use planned trajectory values directly as feedforward (no feedback correction).
    # false: use state feedback + PID to correct tracking errors. Recommended for real hardware.
    open_loop_control: true
    # true: a trajectory goal may specify only a subset of joints.
    # false: every goal must specify all joints controlled by this controller.
    allow_partial_joints_goal: true
    # PID gains used when command_interfaces include velocity / effort.
    # p: proportional gain, i: integral gain, d: derivative gain.
    # Start tuning with i=0, d=0, increase p until response is fast but not oscillatory.
    gains:
      thumb_tmc_ps:     { p: 100.0, i: 0.0, d: 10.0 }
      thumb_tmc_aa:     { p: 100.0, i: 0.0, d: 10.0 }
      thumb_tmc_fe:     { p: 100.0, i: 0.0, d: 10.0 }
      thumb_mcp:        { p: 100.0, i: 0.0, d: 10.0 }
      thumb_dip:        { p: 100.0, i: 0.0, d: 10.0 }
      index_mcp_aa:     { p: 100.0, i: 0.0, d: 10.0 }
      index_mcp:        { p: 100.0, i: 0.0, d: 10.0 }
      index_pip:        { p: 100.0, i: 0.0, d: 10.0 }
      index_dip:        { p: 100.0, i: 0.0, d: 10.0 }
      middle_mcp:       { p: 100.0, i: 0.0, d: 10.0 }
      middle_pip:       { p: 100.0, i: 0.0, d: 10.0 }
      middle_dip:       { p: 100.0, i: 0.0, d: 10.0 }
      ring_mcp:         { p: 100.0, i: 0.0, d: 10.0 }
      ring_pip:         { p: 100.0, i: 0.0, d: 10.0 }
      ring_dip:         { p: 100.0, i: 0.0, d: 10.0 }
      little_mcp:       { p: 100.0, i: 0.0, d: 10.0 }
      little_pip:       { p: 100.0, i: 0.0, d: 10.0 }
      little_dip:       { p: 100.0, i: 0.0, d: 10.0 }
    # Trajectory execution constraints.
    # goal_time: extra seconds allowed after planned trajectory end to reach the goal.
    # stopped_velocity_tolerance: rad/s threshold below which a joint is considered stopped.
    # goal: final position error tolerance (rad).
    # trajectory: max allowed deviation from planned trajectory during execution (rad).
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.01
      thumb_tmc_ps:     { goal: 0.1, trajectory: 0.1 }
      thumb_tmc_aa:     { goal: 0.1, trajectory: 0.1 }
      thumb_tmc_fe:     { goal: 0.1, trajectory: 0.1 }
      thumb_mcp:        { goal: 0.1, trajectory: 0.1 }
      thumb_dip:        { goal: 0.1, trajectory: 0.1 }
      index_mcp_aa:     { goal: 0.1, trajectory: 0.1 }
      index_mcp:        { goal: 0.1, trajectory: 0.1 }
      index_pip:        { goal: 0.1, trajectory: 0.1 }
      index_dip:        { goal: 0.1, trajectory: 0.1 }
      middle_mcp:       { goal: 0.1, trajectory: 0.1 }
      middle_pip:       { goal: 0.1, trajectory: 0.1 }
      middle_dip:       { goal: 0.1, trajectory: 0.1 }
      ring_mcp:         { goal: 0.1, trajectory: 0.1 }
      ring_pip:         { goal: 0.1, trajectory: 0.1 }
      ring_dip:         { goal: 0.1, trajectory: 0.1 }
      little_mcp:       { goal: 0.1, trajectory: 0.1 }
      little_pip:       { goal: 0.1, trajectory: 0.1 }
      little_dip:       { goal: 0.1, trajectory: 0.1 }
