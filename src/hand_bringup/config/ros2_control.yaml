ghand_hardware:
  ros__parameters:
    update_rate: 100
    joints:
      - little_mcp
      - little_pip
      - little_dip
      - ring_mcp
      - ring_pip
      - ring_dip
      - middle_mcp
      - middle_pip
      - middle_dip
      - index_mcp_aa
      - index_mcp
      - index_pip
      - index_dip
      - thumb_tmc_ps
      - thumb_tmc_aa
      - thumb_tmc_fe
      - thumb_mcp
      - thumb_dip
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # TODO: Add EtherCAT/RS485/CANFD parameters
    ethercat:
      ifname: "eth0"
    canfd:
      channel: 0
      bitrate: 1000000
