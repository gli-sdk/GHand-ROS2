ghand_hardware:
  ros__parameters:
    update_rate: 100

    # Communication backend: ethercat | rs485 | canfd
    communication_type: "ethercat"
    read_timeout_ms: 500

    joints:
      - thumb_mcp
      - thumb_tmc_fe
      - thumb_tmc_aa
      - thumb_tmc_ps
      - index_pip
      - index_mcp
      - index_mcp_aa
      - middle_pip
      - middle_mcp
      - ring_pip
      - ring_mcp
      - little_pip
      - little_mcp
    command_interfaces:
      - position
      - velocity
      - effort
    state_interfaces:
      - position
      - velocity
      - effort
      - state
      - error

    # EtherCAT backend parameters
    ifname: "enxe466e5820449"

    # RS485 backend parameters (uncomment when communication_type == "rs485")
    # device: "/dev/ttyUSB0"
    # baud_rate: 1000000
    # slave_id: 49
    # data_bits: 8
    # stop_bits: 1
    # parity: "N"
    # response_timeout_ms: 100

    # CANFD backend parameters (uncomment when communication_type == "canfd")
    # device: "ZCAN_USBCANFD_100U:0:0"
    # bitrate: 1000000
    # dbit_rate: 5000000
    # device_id: 49

    # Tactile sensor layout: per-region distributed sensor counts.
    # Order: THUMB, FF, MF, RF, LF
    # Tactile sensor layout: per-region distributed sensor counts.
    # Order: THUMB, FF, MF, RF, LF
    tactile_region_counts: "38,31,31,31,31"
